name: ESLint Rules

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  eslint-rules:
    name: Build eslint-rules & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build eslint-rules
        run: npm run build:eslint-rules

      - name: Lint (ESLint)
        run: npm run lint
